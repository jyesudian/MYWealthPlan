        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold); }
        
        /* Custom UI sliders and switches */
        input[type=range] {
            accent-color: var(--gold);
            cursor: pointer;
        }

            @page {
                size: A4;
                margin: 15mm;

            body {
                background: #ffffff !important;

                font-family: 'Outfit', sans-serif !important;
                font-size: 13px !important;
                line-height: 1.5 !important;

            body::before {

                color: #1a1d26 !important;

            // Collect Property Rental
            const propertiesRental = (D.properties || []).reduce((sum, p) => sum + (parseFloat(p.rental) || 0), 0);

            const bonds = parseFloat(D.bonds) || 0;
            const otherInvest = parseFloat(D.otherInvest) || 0;
            const propertiesValue = (D.properties || []).reduce((sum, p) => sum + (parseFloat(p.value) || 0), 0);
            const totalAssets = savings + epf + unitTrusts + stocks + bonds + otherInvest + propertiesValue;

            // Liabilities
            const loansBalance = (D.loans || []).reduce((sum, l) => sum + (parseFloat(l.balance) || 0), 0);
            const loansMonthly = (D.loans || []).reduce((sum, l) => sum + (parseFloat(l.monthly) || 0), 0);
            const creditCard = parseFloat(D.creditCard) || 0;
            const totalLiabilities = loansBalance + creditCard;

            // Net Worth
            const netWorth = totalAssets - totalLiabilities;

            // DSR (Debt Service Ratio)
            const dsr = totalMonthlyIncome > 0 ? (loansMonthly / totalMonthlyIncome) * 100 : 0;

            // Insurance Calculations (10x income rule)
            const annualIncome = totalMonthlyIncome * 12;
            const lifeRequired = annualIncome * 10;
            const totalSumAssured = (D.policies || []).reduce((sum, p) => sum + (parseFloat(p.sum) || 0), 0);
            const lifeGap = Math.max(0, lifeRequired - totalSumAssured);

            // Emergency Buffer (6 months of living expenses target)
            const monthlyExpenses = parseFloat(D.monthlyExpenses) || 0;
            const emergencyTarget = monthlyExpenses * 6;
            const currentSavings = savings; // Quick liquid access
            const emergencyFundPct = emergencyTarget > 0 ? (currentSavings / emergencyTarget) * 100 : 0;

            // Cash Surplus / Deficit
            const monthlySurplus = totalMonthlyIncome - loansMonthly - monthlyExpenses;
            const savingsRate = totalMonthlyIncome > 0 ? (monthlySurplus / totalMonthlyIncome) * 100 : 0;

            // Retirement Target Corpus (25x Rule)
            const desiredRetIncome = parseFloat(D.retireIncome) || 0;
            const retirementCorpusNeed = desiredRetIncome * 12 * 25;

            // Dynamic Score (out of 100)

            // DSR Contribution
            if (dsr < 30) healthScore += 20;
            else if (dsr < 45) healthScore += 10;
            
            // Savings Rate Contribution
            if (savingsRate >= 25) healthScore += 20;
            else if (savingsRate >= 10) healthScore += 10;

            // Emergency Buffer Contribution
            if (currentSavings >= emergencyTarget) healthScore += 15;
            else if (currentSavings >= (emergencyTarget / 2)) healthScore += 8;

            // Insurance Gap Contribution
            if (lifeRequired > 0 && lifeGap === 0) healthScore += 15;
            else if (totalSumAssured > 0) healthScore += 8;

            // Estate Planning Contribution
            if (D.hasWill === 'Yes') healthScore += 10;
            if (D.hasBeneficiary === 'Yes, all done' || D.hasBeneficiary === 'Yes') healthScore += 10;

            return {
                totalMonthlyIncome,
                totalAssets,
                totalLiabilities,
                netWorth,
                loansMonthly,
                dsr,
                totalSumAssured,
                lifeRequired,
                lifeGap,
                emergencyTarget,
                emergencyFundPct,
                monthlySurplus,

                                            <i className="fas fa-info-circle mt-0.5"></i>
                                            <div>
                                                <strong>Liquidity Shortfall:</strong> Cash reserves cover {Math.round(calculated.emergencyFundPct)}% of the 6-month living expenses buffer.
                                            </div>

                                    ) : (
                                        <div className="flex gap-2 p-2.5 bg-green/10 border border-green/20 rounded-md text-xs text-green">
                                            <i className="fas fa-check-circle mt-0.5"></i>

        /* =========================================================================
           DISCOVERY FORM VIEW (DUAL MODE: CLIENT VS ADVISOR)
           ========================================================================= */
        const DiscoveryFormView = ({ 
            clientData, 
            setClientData, 
            calculated,
            formMode, 
            setFormMode, 
            step, 
            setStep,
            saveDraft,
            session,
            customComments,
            saveCustomComment
        }) => {
            const isCFP = session && session.role === 'advisor';
            const activeFormMode = isCFP ? 'advisor' : formMode;

            const [editingComment, setEditingComment] = useState(false);
            const [commentDraft, setCommentDraft] = useState('');

            // Reset editing mode when step changes
            useEffect(() => {
                setEditingComment(false);
            }, [step]);

            const handleStartEdit = () => {
                setCommentDraft(getExplanatoryAlert(step));
                setEditingComment(true);
            };

            const handleSaveEdit = () => {
                saveCustomComment(step, commentDraft);
                setEditingComment(false);
            };

            const steps = [
                { id: 'personal', label: 'Identity', icon: '👤', desc: 'Personal details under BNM Guidelines.' },
                { id: 'family', label: 'Family', icon: '🏠', desc: 'Spouse, children, and LHDN dependents.' },
                { id: 'income', label: 'Income', icon: '💼', desc: 'Employment, salary, and business earnings.' },
                { id: 'assets', label: 'Assets', icon: '💰', desc: 'Savings, EPF statement balances, properties.' },
                { id: 'liabilities', label: 'Liabilities', icon: '📋', desc: 'Mortgages, car loans, card debt.' },
                { id: 'insurance', label: 'Insurance', icon: '🛡️', desc: 'Policy limits and medical coverages.' },
                { id: 'health', label: 'Health', icon: '❤️', desc: 'General wellbeing status.' },
                { id: 'goals', label: 'Goals', icon: '🎯', desc: 'Education, retirement needs, investments.' },
                { id: 'risk', label: 'Risk & Legacy', icon: '⚖️', desc: 'Will (Wasiat), power of attorney, trust.' },
                { id: 'results', label: 'Review', icon: '📊', desc: 'Form summary and next actions.' }
            ];

            // Helper to update text/number inputs
            const updateField = (field, val) => {
                setClientData(prev => ({
                    ...prev,
                    [field]: val
                }));
            };

            // Explanatory alerts for Self-Guided Client Mode
            const getExplanatoryAlert = (currentStep) => {
                if (customComments && customComments[currentStep] !== undefined) {
                    return customComments[currentStep];
                }
                switch(currentStep) {
                    case 0:
                        return "NRIC details and residential addresses are required for regulatory KYC compliance matching Bank Negara Malaysia guidelines. Your preferred name will appear in printed reports.";
                    case 1:
                        return "Under Malaysian tax laws (LHDN), supporting a spouse and children provides key personal tax reliefs (up to RM8k for SSPN deposits and child relief). Listing elderly parents helps check dependencies.";
                    case 2:
                        return "Salary and business income determine statutory EPF deduction brackets (currently 11% employee rate). Having business properties incurs company tax declarations.";
                    case 3:
                        return "EPF savings are crucial for Malaysian retirement adequacy. EPF recommends a minimum threshold of RM240,000 basic savings by age 55. We trace this balance to model future projections.";
                    case 4:
                        return "Debt Service Ratio (DSR) matches your monthly loan payments against your gross income. Malaysian banking guidelines recommend a DSR limit under 60-70% to guarantee future loan approvals.";
                    case 5:
                        return "Medical card limits protect against rising medical inflation in Malaysia (averaging 10-15% annually). Life coverage targets 10x your annual earnings to support families in case of death.";
                    case 6:
                        return "Insurance premium underwriting in Malaysia is heavily weighted by tobacco usage and existing health conditions. Specifying this helps generate accurate cost quotes.";
                    case 7:
                        return "Specifying educational levels (Local vs Private vs Overseas) defines target savings targets. Local university semesters average RM15k-RM40k, while overseas requires RM300k+.";
                    case 8:
                        return "Wills (Wasiat for Muslims) prevent asset freeze. Over RM11B in assets are currently locked in Malaysia due to lack of Wills and probate delays. EPF nominee updates are equally urgent.";
                    default:
                        return "";
                }
            };

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <span className="text-xs font-semibold tracking-wider text-gold uppercase">Discovery Process</span>
                            <h1 className="text-3xl font-serif font-light text-white mt-1">Capture Your Financial Portrait</h1>
                            <p className="text-textDim text-sm mt-1">Please select the filling mode best suited for your context.</p>
                        </div>
                        
                        {/* Dual Form Mode Toggle */}
                        {!isCFP ? (
                            <div className="flex bg-surface border border-border p-1 rounded-lg">
                                <button 
                                    onClick={() => setFormMode('guided')}
                                    className={`px-4 py-2 rounded text-xs font-semibold flex items-center gap-2 transition-all ${formMode === 'guided' ? 'bg-gold text-bg shadow' : 'text-textDim hover:text-text'}`}
                                >
                                    <i className="fas fa-compass"></i> Self-Guided (Client)
                                </button>
                                <button 
                                    onClick={() => setFormMode('advisor')}
                                    className={`px-4 py-2 rounded text-xs font-semibold flex items-center gap-2 transition-all ${formMode === 'advisor' ? 'bg-gold text-bg shadow' : 'text-textDim hover:text-text'}`}
                                >
                                    <i className="fas fa-user-tie"></i> Advisor Direct Entry
                                </button>
                            </div>
                        ) : (
                            <span className="text-[10px] font-bold text-gold uppercase tracking-wider bg-goldDim/30 border border-gold/20 px-3 py-2 rounded flex items-center gap-1.5 font-sans">
                                <i className="fas fa-user-tie text-[9px]"></i> Professional CFP Advisor Direct Entry Mode
                            </span>
                        )}
                    </div>

                    {/* =========================================================================
                       SELF-GUIDED MODE (STEP-BY-STEP)
                       ========================================================================= */}
                    {activeFormMode === 'guided' && (
                        <div className="grid grid-cols-1 lg:grid-cols-4 gap-6 items-start">
                            {/* Steps Side Tracker */}
                            <div className="lg:col-span-1 bg-surface border border-border rounded-lg p-4 space-y-1">
                                <p className="text-[10px] text-textDim uppercase font-bold tracking-wider px-3 mb-2">Step Progress</p>
                                {steps.map((s, idx) => (
                                    <button
                                        key={s.id}
                                        onClick={() => setStep(idx)}
                                        className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left transition-all ${step === idx ? 'bg-goldDim text-gold border border-gold/20' : (idx < step ? 'text-textMid hover:bg-surface2/50' : 'text-textDim hover:bg-surface2/30')}`}
                                    >
                                        <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold ${idx < step ? 'bg-gold text-bg' : step === idx ? 'bg-gold text-bg' : 'bg-border text-textDim'}`}>
                                            {idx < step ? '✓' : idx + 1}
                                        </span>
                                        <div className="min-w-0">
                                            <p className="text-xs font-semibold truncate">{s.label}</p>
                                        </div>
                                    </button>
                                ))}
                            </div>

                            {/* Center Panel */}
                            <div className="lg:col-span-3 space-y-6">
                                {/* Context Prompt (Why Ask Alert) */}
                                {step < 9 && (
                                    <div className="bg-goldDim border border-gold/30 rounded-lg p-4 text-xs text-textMid leading-relaxed relative group">
                                        <div className="flex justify-between items-start gap-4">

                                                <span className="text-gold text-base select-none mt-0.5">💡</span>

                                                        <div className="mt-2 space-y-2">
                                                            <textarea
                                                                value={commentDraft}
                                                                onChange={(e) => setCommentDraft(e.target.value)}

                                                                <button onClick={() => setEditingComment(false)} className="border border-border px-2.5 py-1 rounded text-[10px] text-textDim hover:text-white transition-colors">Cancel</button>
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <span>{getExplanatoryAlert(step)}</span>
                                                    )}
                                                </div>
                                            </div>
                                            {!editingComment && (
                                                <button 
                                                    onClick={handleStartEdit} 
                                                    className="opacity-0 group-hover:opacity-100 transition-opacity text-gold hover:text-white text-[10px] font-semibold flex items-center gap-1 bg-surface2 px-2 py-1 border border-border rounded whitespace-nowrap"
                                                    title="Edit Explanatory Comment"
                                                >
                                                    <i className="fas fa-edit"></i> Edit Guide
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                )}

                                <Card>
                                    <div className="border-b border-border pb-4 mb-6">
                                        <span className="text-[10px] uppercase font-bold tracking-widest text-gold">{steps[step].desc}</span>
                                        <h2 className="text-2xl font-serif text-white mt-1">{steps[step].label} Details</h2>
                                    </div>

                                    {/* Render dynamic sub forms */}
                                    <DiscoverySubForm step={step} clientData={clientData} setClientData={setClientData} updateField={updateField} calculated={calculated} />

                                    {/* Navigation Buttons */}
                                    <div className="flex justify-between items-center border-t border-border mt-8 pt-6">
                                        <button
                                            onClick={() => setStep(prev => Math.max(0, prev - 1))}
                                            disabled={step === 0}
                                            className={`px-5 py-2.5 border border-border rounded-lg text-xs font-semibold transition-all ${step === 0 ? 'text-textDim opacity-40 cursor-not-allowed' : 'text-text hover:bg-surface2 hover:border-textDim'}`}
                                        >
                                            <i className="fas fa-arrow-left mr-2"></i> Previous
                                        </button>

                                        {step < 9 ? (
                                            <button
                                                onClick={() => setStep(prev => Math.min(9, prev + 1))}
                                                className="bg-gold hover:bg-yellow-600 text-bg px-6 py-2.5 rounded-lg text-xs font-semibold transition-all"
                                            >
                                                Next Step <i className="fas fa-arrow-right ml-2"></i>
                                            </button>
                                        ) : (
                                            <button
                                                onClick={() => window.print()}
                                                className="bg-green hover:bg-emerald-600 text-white px-6 py-2.5 rounded-lg text-xs font-semibold transition-all"
                                            >
                                                📄 Print Full Summary
                                            </button>
                                        )}
                                    </div>
                                </Card>
                            </div>
                        </div>
                    )}

                    {/* =========================================================================
                       ADVISOR DIRECT ENTRY MODE (ACCORDION / CONTINUOUS FORM)
                       ========================================================================= */}
                    {activeFormMode === 'advisor' && (
                        <div className="grid grid-cols-1 xl:grid-cols-4 gap-6 items-start">

                                <div className="bg-surface2/50 border border-border p-4 rounded-lg flex items-center justify-between text-xs text-textMid">
                                    <span>
                                        <i className="fas fa-info-circle text-gold mr-1.5"></i>
                                        <strong>Advisor Entry Mode active:</strong> Fields are compact for rapid typing. Data is dynamically shared.
                                    </span>
                                    <button 
                                        onClick={saveDraft}
                                        className="bg-gold text-bg px-3 py-1.5 rounded font-semibold text-[10px] hover:bg-yellow-600 uppercase tracking-wider transition-all"
                                    >
                                        Save Client Profile
                                    </button>
                                </div>

                                <Card>
                                    <div className="space-y-10">
                                        {/* Identity Section */}
                                        <div>

        /* =========================================================================

                    ...prev,

                                    <div className={`text-lg mt-0.5 ${rec.iconColor} flex-shrink-0`}>
                                        <i className={`fas ${rec.icon}`}></i>
                                    </div>
                                    <div className="space-y-1 font-sans">
                                        <h4 className="font-serif font-bold text-white text-sm">{rec.title}</h4>
                                        <p className="text-[10px] text-gold font-semibold">{rec.product}</p>

            );
        };

        /* =========================================================================
           INTERACTIVE SANDBOX VIEW (IMPACT CALCULATORS & SVG CHARTS)
           ========================================================================= */
        const SandboxView = ({ clientData, calculated }) => {
            // Initialize sandbox parameters from client profile
            const [curAge, setCurAge] = useState(38);
            const [retAge, setRetAge] = useState(parseInt(clientData.retireAge) || 60);
            const [initSavings, setInitSavings] = useState(clientData.savings + clientData.epf);
            const [monthlySave, setMonthlySave] = useState(calculated.monthlySurplus > 0 ? Math.round(calculated.monthlySurplus) : 1500);
            const [roi, setRoi] = useState(6); // 6% annual growth default
            const [retBudget, setRetBudget] = useState(8000); // RM 8,000/month post-retirement
            const [inflation, setInflation] = useState(3); // 3% inflation default

            // Calculate Retirement Wealth Curve
            const projectedYears = [];
            let currentWealth = initSavings;
            let runOutAge = null;

            for (let age = curAge; age <= 85; age++) {
                projectedYears.push({ age, wealth: currentWealth });
                
                // Growth phase (Pre-retirement)
                if (age < retAge) {
                    currentWealth = currentWealth * (1 + roi / 100) + (monthlySave * 12);
                } 
                // Decumulation phase (Post-retirement)
                else {
                    const yearsInRetirement = age - retAge;
                    const adjustedAnnualBudget = (retBudget * 12) * Math.pow(1 + inflation / 100, yearsInRetirement);
                    currentWealth = currentWealth * (1 + roi / 100) - adjustedAnnualBudget;
                }

                if (currentWealth < 0) {
                    currentWealth = 0;
                    if (runOutAge === null) {
                        runOutAge = age;
                    }
                }
            }

            // SVG Line Chart Helpers
            const maxWealth = Math.max(...projectedYears.map(y => y.wealth), 100000);
            const chartWidth = 460;
            const chartHeight = 160;
            const padding = { top: 15, right: 15, bottom: 25, left: 55 };

            const getX = (age) => {
                return padding.left + ((age - curAge) / (85 - curAge)) * (chartWidth - padding.left - padding.right);
            };

            const getY = (wealth) => {
                return padding.top + (1 - (wealth / maxWealth)) * (chartHeight - padding.top - padding.bottom);
            };

            // Build path d attribute
            let pathD = "";
            let areaD = "";
            if (projectedYears.length > 0) {
                pathD = `M ${getX(projectedYears[0].age)} ${getY(projectedYears[0].wealth)}`;
                areaD = `M ${getX(projectedYears[0].age)} ${chartHeight - padding.bottom}`;
                
                projectedYears.forEach(y => {
                    const x = getX(y.age);
                    const yPos = getY(y.wealth);
                    pathD += ` L ${x} ${yPos}`;
                    areaD += ` L ${x} ${yPos}`;
                });
                
                areaD += ` L ${getX(projectedYears[projectedYears.length - 1].age)} ${chartHeight - padding.bottom} Z`;
            }

            // Build Milestones for Timeline Ruler
            const milestones = [
                ...(clientData.eduGoals || []).map(g => ({ ...g, category: 'Children Education', icon: 'fa-graduation-cap', year: new Date().getFullYear() + 10, color: 'text-blue' })),
                ...(clientData.purchases || []).map(g => {
                    const cat = mCategoryMapping(g) || 'Other Milestone';
                    const icon = cat === 'Vehicle Purchase' ? 'fa-car' : cat === 'Home Buying' ? 'fa-home' : cat === 'Foreign Trips' ? 'fa-plane-departure' : cat === 'Children Wedding' ? 'fa-ring' : cat === 'Retirement Corpus Creation' ? 'fa-umbrella-beach' : 'fa-bullseye';
                    const col = cat === 'Home Buying' ? 'text-gold' : 'text-amber';
                    return { ...g, category: cat, icon, year: g.year, color: col };
                })
            ];

            // Helper to map category names securely
            function mCategoryMapping(g) {
                if (g.category) return g.category;
                const type = g.type || '';
                if (type === 'Car') return 'Vehicle Purchase';
                if (type === 'House' || type === 'Home') return 'Home Buying';
                if (type === 'Travel' || type === 'Trip' || type === 'Holiday') return 'Foreign Trips';
                if (type === 'Wedding') return 'Children Wedding';
                if (type === 'Retirement') return 'Retirement Corpus Creation';
                return 'Other Milestone';
            }

            // SVG Donut Chart for Assets & Liabilities
            const totalAssets = clientData.savings + clientData.epf + (clientData.properties || []).reduce((acc, p) => acc + (p.value || 0), 0);
            const totalLiabs = (clientData.loans || []).reduce((acc, l) => acc + (l.balance || 0), 0);
            const netWorth = totalAssets - totalLiabs;
            
            const totalSum = totalAssets + totalLiabs;
            const assetPct = totalSum > 0 ? (totalAssets / totalSum) * 100 : 100;
            const liabPct = totalSum > 0 ? (totalLiabs / totalSum) * 100 : 0;

            const radius = 40;
            const circumference = 2 * Math.PI * radius;
            const assetStrokeDash = circumference * (assetPct / 100);
            const liabStrokeDash = circumference * (liabPct / 100);
            
            return (
                <div className="space-y-6 animate-fade-in">
                    <div>
                        <span className="text-xs font-semibold tracking-wider text-gold uppercase">Simulator Sandbox</span>
                        <h1 className="text-3xl font-serif font-light text-white mt-1">Interactive Impact Sandbox</h1>
                        <p className="text-textDim text-sm mt-1">Adjust retirement savings parameters, interest rates, and inflation to view immediate impacts on your timeline.</p>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* Simulation Controls */}
                        <Card className="lg:col-span-1 space-y-5">
                            <h3 className="font-serif text-lg text-white border-b border-border pb-2.5">Simulation Sliders</h3>
                            
                            <div className="space-y-4 text-xs font-sans">
                                <div className="space-y-1.5">
                                    <div className="flex justify-between">
                                        <span className="text-textDim font-medium">Current Age: <strong className="text-white">{curAge} yrs</strong></span>
                                    </div>
                                    <input type="range" min="20" max="70" value={curAge} onChange={(e) => {
                                        const val = parseInt(e.target.value);
                                        setCurAge(val);
                                        if (val >= retAge) setRetAge(val + 1);
                                    }} className="w-full" />
                                </div>

                                <div className="space-y-1.5">
                                    <div className="flex justify-between">
                                        <span className="text-textDim font-medium">Retirement Target Age: <strong className="text-gold">{retAge} yrs</strong></span>
                                    </div>
                                    <input type="range" min={curAge + 1} max="80" value={retAge} onChange={(e) => setRetAge(parseInt(e.target.value))} className="w-full" />
                                </div>

                                <div className="space-y-2">
                                    <label className="text-textDim font-medium">Initial Savings (Cash + EPF) (RM)</label>
                                    <input type="number" value={initSavings} onChange={(e) => setInitSavings(parseFloat(e.target.value) || 0)} className="w-full bg-surface2 border border-border rounded px-3 py-2 text-white outline-none focus:border-gold" />
                                </div>

                                <div className="space-y-2">
                                    <label className="text-textDim font-medium">Monthly Additional Savings (RM)</label>
                                    <input type="number" value={monthlySave} onChange={(e) => setMonthlySave(parseFloat(e.target.value) || 0)} className="w-full bg-surface2 border border-border rounded px-3 py-2 text-white outline-none focus:border-gold" />
                                </div>

                                <div className="space-y-1.5">
                                    <div className="flex justify-between">
                                        <span className="text-textDim font-medium">Annual Investment Yield (ROI): <strong className="text-green">{roi}%</strong></span>
                                    </div>
                                    <input type="range" min="1" max="15" step="0.5" value={roi} onChange={(e) => setRoi(parseFloat(e.target.value))} className="w-full" />
                                </div>

                                <div className="space-y-2">
                                    <label className="text-textDim font-medium">Post-Retirement Monthly Budget (RM)</label>
                                    <input type="number" value={retBudget} onChange={(e) => setRetBudget(parseFloat(e.target.value) || 0)} className="w-full bg-surface2 border border-border rounded px-3 py-2 text-white outline-none focus:border-gold" />
                                </div>

                                <div className="space-y-1.5">
                                    <div className="flex justify-between">
                                        <span className="text-textDim font-medium">Assumed Inflation Rate: <strong className="text-red">{inflation}%</strong></span>
                                    </div>
                                    <input type="range" min="0" max="8" step="0.5" value={inflation} onChange={(e) => setInflation(parseFloat(e.target.value))} className="w-full" />
                                </div>
                            </div>
                        </Card>

                        {/* Interactive Dynamic Charts */}
                        <div className="lg:col-span-2 space-y-6">
                            {/* Wealth Trend SVG Area Chart */}
                            <Card className="flex flex-col justify-between">
                                <div>
                                    <div className="flex justify-between items-start mb-2">
                                        <div>
                                            <h3 className="font-serif text-lg text-white">Projected Net Wealth Trend</h3>
                                            <p className="text-xs text-textDim">Asset accumulation trajectory up to age 85</p>
                                        </div>
                                        {runOutAge !== null ? (
                                            <span className="text-[10px] font-bold uppercase px-2.5 py-1 rounded bg-red/10 border border-red/20 text-red flex items-center gap-1.5">
                                                <i className="fas fa-exclamation-triangle"></i> Funds deplete at Age {runOutAge}
                                            </span>
                                        ) : (
                                            <span className="text-[10px] font-bold uppercase px-2.5 py-1 rounded bg-green/10 border border-green/20 text-green flex items-center gap-1.5">
                                                <i className="fas fa-shield-alt"></i> Sustainable to Age 85
                                            </span>
                                        )}
                                    </div>

                                    {/* SVG Line Drawing */}
                                    <div className="relative mt-2">
                                        <svg viewBox={`0 0 ${chartWidth} ${chartHeight}`} className="w-full h-auto overflow-visible font-sans text-[9px] fill-none stroke-none">
                                            {/* Grid Lines */}
                                            <line x1={padding.left} y1={getY(maxWealth)} x2={chartWidth - padding.right} y2={getY(maxWealth)} stroke="var(--border)" strokeWidth="0.5" strokeDasharray="3 3" />
                                            <line x1={padding.left} y1={getY(maxWealth / 2)} x2={chartWidth - padding.right} y2={getY(maxWealth / 2)} stroke="var(--border)" strokeWidth="0.5" strokeDasharray="3 3" />
                                            <line x1={padding.left} y1={getY(0)} x2={chartWidth - padding.right} y2={getY(0)} stroke="var(--border)" strokeWidth="1" />

                                            {/* Area Under Curve */}
                                            <path d={areaD} fill={runOutAge ? 'rgba(224, 92, 92, 0.08)' : 'rgba(212, 168, 83, 0.08)'} />
                                            
                                            {/* Wealth Line Path */}
                                            <path d={pathD} stroke={runOutAge ? '#e05c5c' : '#d4a853'} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />

                                            {/* Y-Axis Labels */}
                                            <text x={padding.left - 8} y={getY(maxWealth) + 3} textAnchor="end" fill="var(--textDim)">{fmt(maxWealth)}</text>
                                            <text x={padding.left - 8} y={getY(maxWealth / 2) + 3} textAnchor="end" fill="var(--textDim)">{fmt(maxWealth / 2)}</text>
                                            <text x={padding.left - 8} y={getY(0) + 3} textAnchor="end" fill="var(--textDim)">RM 0</text>

                                            {/* X-Axis Labels (Ages) */}
                                            <text x={getX(curAge)} y={chartHeight - 8} textAnchor="middle" fill="var(--textDim)">Age {curAge}</text>
                                            <text x={getX(retAge)} y={chartHeight - 8} textAnchor="middle" fill="var(--gold)" fontWeight="bold">Age {retAge}</text>
                                            <text x={getX(85)} y={chartHeight - 8} textAnchor="middle" fill="var(--textDim)">Age 85</text>

                                            {/* Vertical Line for Retirement age */}
                                            <line x1={getX(retAge)} y1={padding.top} x2={getX(retAge)} y2={chartHeight - padding.bottom} stroke="var(--gold)" strokeWidth="1" strokeDasharray="2 2" />

                                            {/* Wealth Run-Out Indicator Node */}
                                            {runOutAge !== null && (
                                                <g>
                                                    <circle cx={getX(runOutAge)} cy={getY(0)} r="4" fill="#e05c5c" />
                                                    <circle cx={getX(runOutAge)} cy={getY(0)} r="8" stroke="#e05c5c" strokeWidth="1.5" className="animate-ping" fill="none" />
                                                </g>
                                            )}
                                        </svg>
                                    </div>
                                </div>
                                <div className="mt-4 border-t border-border/60 pt-4 flex gap-4 text-xs font-sans text-textMid leading-relaxed">
                                    <i className="fas fa-info-circle text-gold mt-0.5"></i>
                                    <div>
                                        {runOutAge !== null ? (
                                            <span>At your current parameters, wealth will deplete at **Age {runOutAge}**. Consider raising monthly contributions by **RM {Math.round((retBudget * 12) / 24).toLocaleString('en-MY')}** or postponing retirement to cover the gap.</span>
                                        ) : (
                                            <span>Your retirement fund is sustainable! At Age 85, you are projected to retain a legacy surplus of **{fmt(projectedYears[projectedYears.length - 1].wealth)}** for heirs.</span>
                                        )}
                                    </div>
                                </div>
                            </Card>

                            {/* Donut and Milestone Timeline Ruler in a Grid */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {/* Asset/Liability Donut Chart */}
                                <Card className="flex flex-col justify-between">
                                    <h3 className="font-serif text-base text-white mb-2">Net Worth Composition</h3>
                                    <div className="flex items-center gap-4 py-2">
                                        {/* SVG Donut */}
                                        <svg viewBox="0 0 100 100" className="w-24 h-24 transform -rotate-90">
                                            {/* Asset Circle */}
                                            <circle cx="50" cy="50" r={radius} fill="transparent" stroke="var(--gold)" strokeWidth="10" strokeDasharray={`${assetStrokeDash} ${circumference}`} />
                                            {/* Liability Circle */}
                                            <circle cx="50" cy="50" r={radius} fill="transparent" stroke="#e05c5c" strokeWidth="10" strokeDasharray={`${liabStrokeDash} ${circumference}`} strokeDashoffset={-assetStrokeDash} />
                                        </svg>
                                        
                                        <div className="space-y-1.5 text-xs font-sans">
                                            <div className="flex items-center gap-2">
                                                <span className="w-3 h-3 rounded-full bg-gold"></span>
                                                <span className="text-textDim">Assets: <strong className="text-white">{assetPct.toFixed(0)}%</strong></span>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <span className="w-3 h-3 rounded-full bg-red"></span>
                                                <span className="text-textDim">Liabilities: <strong className="text-white">{liabPct.toFixed(0)}%</strong></span>
                                            </div>
                                            <div className="border-t border-border/60 pt-1.5 mt-1 font-semibold text-white">
                                                Net Worth: {fmt(netWorth)}
                                            </div>
                                        </div>
                                    </div>
                                </Card>

                                {/* Milestone timeline ruler */}
                                <Card className="flex flex-col justify-between">
                                    <h3 className="font-serif text-base text-white mb-2">Milestones Timeline Ruler</h3>
                                    
                                    <div className="relative py-4 pr-2 pl-4">
                                        {milestones.length === 0 ? (
                                            <p className="text-xs text-textDim text-center py-4 font-sans">No active milestones declared. Add milestones in Goal Planning tab.</p>
                                        ) : (
                                            <div className="relative font-sans text-[10px] space-y-4">
                                                {/* Vertical line connecting milestones */}
                                                <div className="absolute left-3.5 top-2 bottom-2 w-0.5 bg-border"></div>

                                                {milestones.slice(0, 3).map((m, idx) => (
                                                    <div key={idx} className="flex items-start gap-4 relative">
                                                        <div className={`w-7 h-7 rounded-full bg-surface2 border border-border flex items-center justify-center ${m.color} z-10 text-xs`}>
                                                            <i className={`fas ${m.icon}`}></i>
                                                        </div>
                                                        <div className="min-w-0 flex-1">
                                                            <div className="flex justify-between font-semibold">
                                                                <span className="text-white truncate">{m.type || m.name || 'Milestone'}</span>
                                                                <span className="text-gold">{m.year || 2030}</span>
                                                            </div>
                                                            <p className="text-[10px] text-textDim truncate">{fmt(m.cost || m.fund)} required</p>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </Card>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        /* =========================================================================
           TRUST EQUATION SCORECARD VIEW
           ========================================================================= */
        const TrustScorecardView = ({ trustScores, setTrustScores, clientData, lang }) => {
            const [answers, setAnswers] = useState(() => ({
                q1: trustScores.credibility || 7,
                q2: trustScores.reliability || 7,
                q3: trustScores.reliability || 7,
                q4: trustScores.intimacy || 7,
                q5: trustScores.selfOrientation || 5
            }));

            // Sync answers to parent trustScores state
            useEffect(() => {
                const c = answers.q1;
                const r = Math.round((answers.q2 + answers.q3) / 2);
                const i = answers.q4;
                const s = answers.q5;
                setTrustScores({
                    credibility: c,
                    reliability: r,
                    intimacy: i,
                    selfOrientation: s
                });
            }, [answers]);

            const { credibility, reliability, intimacy, selfOrientation } = trustScores;
            const trustScore = (credibility + reliability + intimacy) / Math.max(0.1, selfOrientation);
            
            // Determine level and color
            let trustLevel = "Low Trust Integration";
            let gaugeColor = "bg-red";
            let borderGlow = "border-red/30 shadow-[0_0_15px_rgba(224,92,92,0.1)]";
            let description = "Self-orientation dominates the relationship. Focus on client-first auditing and transparency to build connection.";

            if (trustScore >= 15) {
                trustLevel = "Trusted Advisor Relationship (Elite)";
                gaugeColor = "bg-green";
                borderGlow = "border-green/30 shadow-[0_0_20px_rgba(76,175,130,0.15)]";
                description = "High intimacy and credibility combined with deep client-first alignment. This creates safe disclosures and highly effective plans.";
            } else if (trustScore >= 5) {
                trustLevel = "Transactional Credibility (Balanced)";
                gaugeColor = "bg-amber";
                borderGlow = "border-gold/30 shadow-[0_0_15px_rgba(212,168,83,0.1)]";
                description = "A reliable advisory state, though intimacy can be increased through active listening, or self-focus can be lowered by decoupling sales incentives.";

            const questions = getQuestions(lang);

            return (
                <div className="space-y-6 animate-fade-in">
                    <div>
                        <span className="text-xs font-semibold tracking-wider text-gold uppercase">{t('trust_analytics', lang)}</span>
                        <h1 className="text-3xl font-serif font-light text-white mt-1">{t('advisor_trust_assessment', lang)}</h1>
                        <p className="text-textDim text-sm mt-1">{t('trust_assessment_desc', lang)}</p>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* Interactive Questionnaire */}
                        <div className="lg:col-span-2 space-y-6">
                            <Card className="space-y-6 text-xs font-sans">

                                <div className="space-y-6">

                                                                isSelected 
                                                                    ? 'bg-goldDim/20 border-gold text-white font-medium shadow-lg shadow-gold/5' 
                                                                    : 'bg-surface2/30 border-border/60 text-textDim hover:border-border hover:bg-surface2/50 hover:text-white'
                                                            }`}
                                                        >
                                                            <div className="flex items-start justify-between gap-2">

                                                                    Score: {opt.val}

                                                            </div>

                                <div className="flex flex-col items-center justify-center py-6 bg-surface2/30 border border-border/40 rounded-lg">

        const CrmBookingModal = ({ clientData, calculated, onClose }) => {

            const [selectedDate, setSelectedDate] = useState('2026-06-15');
            const [selectedTime, setSelectedTime] = useState('14:00');
            
            // Auto-select mapped advisor
            const clientRecord = CLIENT_DB.find(c => c.name === clientData.fullName);
            const mappedAdvisor = clientRecord ? ADVISORS_DB.find(a => a.id === clientRecord.advisorId) : null;
            const [selectedAdvisor, setSelectedAdvisor] = useState(
                mappedAdvisor ? `${mappedAdvisor.name} (${mappedAdvisor.role === 'CFP' ? 'CFP' : 'IFP'})` : 'Farah Hashim (CFP)'

            const handleConfirm = () => {
                setStep(2);
                setTimeout(() => {
                    onClose();

                                            value={selectedAdvisor} 
                                            onChange={(e) => setSelectedAdvisor(e.target.value)}

                                                onChange={(e) => setSelectedDate(e.target.value)}
                                                className="bg-surface2 border border-border rounded p-2 text-white outline-none w-full"
                                            />
                                        </div>
                                        <div className="flex flex-col gap-1">
