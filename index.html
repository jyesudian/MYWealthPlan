    <!-- ElevenLabs Conversational AI Lifecycle Manager (Registered synchronously before the widget script) -->
    <script>
        (function() {
            const IS_DEV = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === '::1';
            
            let originalWebSocket = window.WebSocket;
            let activeTimers = [];
            let isWaitingForFinalResponse = false;
            
            function registerTimer(timerId) {
                activeTimers.push(timerId);
            }
            
            function cleanupTimers() {
                if (IS_DEV && activeTimers.length > 0) {
                    console.log('[ElevenLabs Lifecycle] Cleaning up active timers:', activeTimers.length);
                }
                activeTimers.forEach(t => clearTimeout(t));
                activeTimers = [];
                isWaitingForFinalResponse = false;
            }

            // Monkey-patch WebSocket to intercept transcripts before the widget script is fetched/runs
            window.WebSocket = function(url, protocols) {
                const ws = new originalWebSocket(url, protocols);
                if (url.includes('elevenlabs.io') && url.includes('convai')) {
                    if (IS_DEV) console.log('[ElevenLabs Lifecycle] Intercepted WebSocket connection:', url);
                    
                    ws.addEventListener('message', (event) => {
                        try {
                            const data = JSON.parse(event.data);
                            
                            // User Transcript detection
                            if (data.type === 'user_transcript' && data.user_transcription_event) {
                                const text = data.user_transcription_event.user_transcript || '';
                                if (IS_DEV) console.log('[ElevenLabs Lifecycle] User Transcript:', text);
                                
                                if (checkClosingIntent(text)) {
                                    if (IS_DEV) console.log('[ElevenLabs Lifecycle] Closing intent phrase detected. Waiting for final response...');
                                    isWaitingForFinalResponse = true;
                                }
                            }
                            
                            // Agent Response detection
                            if (data.type === 'agent_response' && data.agent_response_event) {
                                const response = data.agent_response_event.agent_response || '';
                                if (IS_DEV) console.log('[ElevenLabs Lifecycle] Agent Response:', response);
                                
                                if (isWaitingForFinalResponse) {
                                    isWaitingForFinalResponse = false;
                                    if (IS_DEV) console.log('[ElevenLabs Lifecycle] Final response received. Scheduling auto-close in 3.5 seconds...');
                                    
                                    const timer = setTimeout(() => {
                                        closeAiAssistant('closing_intent');
                                    }, 3500);
                                    registerTimer(timer);
                                }
                            }
                        } catch (e) {
                            // Ignore binary audio chunk frames
                        }
                    });
                }
                return ws;
            };
            
            // Preserve WebSocket prototype and static methods
            window.WebSocket.prototype = originalWebSocket.prototype;
            for (let key in originalWebSocket) {
                if (originalWebSocket.hasOwnProperty(key)) {
                    window.WebSocket[key] = originalWebSocket[key];
                }
            }

            // Intent checker
            const CLOSING_PHRASES = [
                "thank you", "thanks", "goodbye", "bye", "see you", 
                "that's all", "no more questions"
            ];
            function checkClosingIntent(text) {
                const cleaned = text.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?]/g, "").trim();
                return CLOSING_PHRASES.some(phrase => {
                    const regex = new RegExp(`\\b${phrase}\\b`, 'i');
                    return regex.test(cleaned);
                });
            }

            // Global Assistant Closer
            window.closeAiAssistant = function(reason) {
                if (IS_DEV) console.log(`[ElevenLabs Lifecycle] closeAiAssistant called with reason: ${reason}`);
                
                const widget = document.querySelector('elevenlabs-convai');
                if (widget) {
                    // Try official terminate API if present
                    if (typeof widget.endConversation === 'function') {
                        widget.endConversation();
                    } else if (typeof widget.disconnect === 'function') {
                        widget.disconnect();
                    }
                    
                    // Trigger minimize/collapse event
                    document.dispatchEvent(new CustomEvent('elevenlabs-agent:expand', {
                        detail: { action: 'collapse', _convaiEventHandled: false }
                    }));
                }
                
                if (document.activeElement) {
                    document.activeElement.blur();
                }
                window.focus();
                cleanupTimers();
            };

            // Window Unload Listeners
            const handlePageUnload = () => {
                window.closeAiAssistant('page_unload');
            };
            window.addEventListener('beforeunload', handlePageUnload);
            window.addEventListener('pagehide', handlePageUnload);
        })();
    </script>

        const calculateFinancials = (D) => {
            const monthlyIncome = parseFloat(D.monthlyIncome) || 0;
            const otherIncome = parseFloat(D.otherIncome) || 0;
            
            // Collect Property Rental
            const propertiesRental = (D.properties || []).reduce((sum, p) => sum + (parseFloat(p.rental) || 0), 0);
            const totalMonthlyIncome = monthlyIncome + otherIncome + propertiesRental;
            
            // Asset categories
            const savings = parseFloat(D.savings) || 0;
            const epf = parseFloat(D.epf) || 0;
            const unitTrusts = parseFloat(D.unitTrusts) || 0;
            const stocks = parseFloat(D.stocks) || 0;
            const bonds = parseFloat(D.bonds) || 0;
            const otherInvest = parseFloat(D.otherInvest) || 0;
            const propertiesValue = (D.properties || []).reduce((sum, p) => sum + (parseFloat(p.value) || 0), 0);
            const totalAssets = savings + epf + unitTrusts + stocks + bonds + otherInvest + propertiesValue;

            // Liabilities
            const loansBalance = (D.loans || []).reduce((sum, l) => sum + (parseFloat(l.balance) || 0), 0);
            const loansMonthly = (D.loans || []).reduce((sum, l) => sum + (parseFloat(l.monthly) || 0), 0);
            const creditCard = parseFloat(D.creditCard) || 0;
            const totalLiabilities = loansBalance + creditCard;

            // Net Worth
            const netWorth = totalAssets - totalLiabilities;

            // DSR (Debt Service Ratio)
            const dsr = totalMonthlyIncome > 0 ? (loansMonthly / totalMonthlyIncome) * 100 : 0;

            // Insurance Calculations (10x income rule)
            const annualIncome = totalMonthlyIncome * 12;
            const lifeRequired = annualIncome * 10;
            const totalSumAssured = (D.policies || []).reduce((sum, p) => sum + (parseFloat(p.sum) || 0), 0);
            const lifeGap = Math.max(0, lifeRequired - totalSumAssured);

            // Emergency Buffer (6 months of living expenses target)
            const monthlyExpenses = parseFloat(D.monthlyExpenses) || 0;
            const emergencyTarget = monthlyExpenses * 6;
            const currentSavings = savings; // Quick liquid access
            const emergencyFundPct = emergencyTarget > 0 ? (currentSavings / emergencyTarget) * 100 : 0;

            // Cash Surplus / Deficit
            const monthlySurplus = totalMonthlyIncome - loansMonthly - monthlyExpenses;
            const savingsRate = totalMonthlyIncome > 0 ? (monthlySurplus / totalMonthlyIncome) * 100 : 0;

            // Retirement Target Corpus (25x Rule)
            const desiredRetIncome = parseFloat(D.retireIncome) || 0;
            const retirementCorpusNeed = desiredRetIncome * 12 * 25;

            // Dynamic Score (out of 100)
            let healthScore = 30; // base score
            
            // DSR Contribution
            if (dsr < 30) healthScore += 20;
            else if (dsr < 45) healthScore += 10;
            
            // Savings Rate Contribution
            if (savingsRate >= 25) healthScore += 20;
            else if (savingsRate >= 10) healthScore += 10;

            // Emergency Buffer Contribution
            if (currentSavings >= emergencyTarget) healthScore += 15;
            else if (currentSavings >= (emergencyTarget / 2)) healthScore += 8;

            // Insurance Gap Contribution
            if (lifeRequired > 0 && lifeGap === 0) healthScore += 15;
            else if (totalSumAssured > 0) healthScore += 8;

            // Estate Planning Contribution
            if (D.hasWill === 'Yes') healthScore += 10;
            if (D.hasBeneficiary === 'Yes, all done' || D.hasBeneficiary === 'Yes') healthScore += 10;

            return {
                totalMonthlyIncome,
                totalAssets,
                totalLiabilities,
                netWorth,
                loansMonthly,
                dsr,
                totalSumAssured,
                lifeRequired,
                lifeGap,
                emergencyTarget,
                emergencyFundPct,
                monthlySurplus,

            const handleRejectSubmit = (reqId) => {

                                    <div className="flex items-center gap-3 mb-3">
                                        <div className="w-10 h-10 rounded-full bg-goldDim border border-gold/30 text-gold flex items-center justify-center font-bold text-sm flex-shrink-0">

                            <Card className="border-t-2 border-t-red">
                                <h3 className="font-serif text-base text-white mb-4">Protection & Liabilities Alerts</h3>
                                <div className="space-y-3">

                                        <div className="flex gap-2 p-2.5 bg-red/10 border border-red/20 rounded-md text-xs text-red">

                                            <div>
                                                <strong>Insurance Gap:</strong> A shortfall of {fmt(calculated.lifeGap)} detected. Consider reviewing term plans.

                                            <div>
                                                <strong>Protection Met:</strong> Sum assured matches the recommended 10x target.
                                            </div>
                                        </div>

                                            <i className="fas fa-exclamation-circle mt-0.5"></i>

                                                <strong>DSR Too High ({calculated.dsr.toFixed(1)}%):</strong> Over leverage risk. Banks may deny further credit approvals.

                                            <i className="fas fa-check-circle mt-0.5"></i>

                                        </div>

                                            <i className="fas fa-info-circle mt-0.5"></i>
                                            <div>
                                                <strong>Liquidity Shortfall:</strong> Cash reserves cover {Math.round(calculated.emergencyFundPct)}% of the 6-month living expenses buffer.
                                            </div>

                                        <div className="flex gap-2 p-2.5 bg-green/10 border border-green/20 rounded-md text-xs text-green">

                    {/* Acknowledgement section */}

                            </div>
                            
                            <div className="space-y-3">
                                <div>
                                    <span className="text-[10px] text-textDim uppercase tracking-wider block font-medium mb-0.5">Concept & Creator</span>
                                    <span className="text-sm text-text font-semibold">Stanley Tan</span>
                                </div>
                                <div>
                                    <span className="text-[10px] text-textDim uppercase tracking-wider block font-medium mb-0.5">Produced by</span>
                                    <div className="text-sm text-text flex flex-col font-semibold space-y-0.5">

        /* =========================================================================
           DISCOVERY FORM VIEW (DUAL MODE: CLIENT VS ADVISOR)
           ========================================================================= */
        const DiscoveryFormView = ({ 
            clientData, 
            setClientData, 
            calculated,
            formMode, 
            setFormMode, 
            step, 
            setStep,
            saveDraft,
            session,
            customComments,
            saveCustomComment
        }) => {
            const isCFP = session && session.role === 'advisor';
            const activeFormMode = isCFP ? 'advisor' : formMode;

            const [editingComment, setEditingComment] = useState(false);
            const [commentDraft, setCommentDraft] = useState('');

            // Reset editing mode when step changes
            useEffect(() => {
                setEditingComment(false);
            }, [step]);

            const handleStartEdit = () => {
                setCommentDraft(getExplanatoryAlert(step));
                setEditingComment(true);
            };

            const handleSaveEdit = () => {
                saveCustomComment(step, commentDraft);
                setEditingComment(false);
            };

            const steps = [
                { id: 'personal', label: 'Identity', icon: '👤', desc: 'Personal details under BNM Guidelines.' },
                { id: 'family', label: 'Family', icon: '🏠', desc: 'Spouse, children, and LHDN dependents.' },
                { id: 'income', label: 'Income', icon: '💼', desc: 'Employment, salary, and business earnings.' },
                { id: 'assets', label: 'Assets', icon: '💰', desc: 'Savings, EPF statement balances, properties.' },
                { id: 'liabilities', label: 'Liabilities', icon: '📋', desc: 'Mortgages, car loans, card debt.' },
                { id: 'insurance', label: 'Insurance', icon: '🛡️', desc: 'Policy limits and medical coverages.' },
                { id: 'health', label: 'Health', icon: '❤️', desc: 'General wellbeing status.' },
                { id: 'goals', label: 'Goals', icon: '🎯', desc: 'Education, retirement needs, investments.' },
                { id: 'risk', label: 'Risk & Legacy', icon: '⚖️', desc: 'Will (Wasiat), power of attorney, trust.' },
                { id: 'results', label: 'Review', icon: '📊', desc: 'Form summary and next actions.' }
            ];

            // Helper to update text/number inputs
            const updateField = (field, val) => {
                setClientData(prev => ({
                    ...prev,
                    [field]: val
                }));
            };

            // Explanatory alerts for Self-Guided Client Mode
            const getExplanatoryAlert = (currentStep) => {
                if (customComments && customComments[currentStep] !== undefined) {
                    return customComments[currentStep];
                }
                switch(currentStep) {
                    case 0:
                        return "NRIC details and residential addresses are required for regulatory KYC compliance matching Bank Negara Malaysia guidelines. Your preferred name will appear in printed reports.";
                    case 1:
                        return "Under Malaysian tax laws (LHDN), supporting a spouse and children provides key personal tax reliefs (up to RM8k for SSPN deposits and child relief). Listing elderly parents helps check dependencies.";
                    case 2:
                        return "Salary and business income determine statutory EPF deduction brackets (currently 11% employee rate). Having business properties incurs company tax declarations.";
                    case 3:
                        return "EPF savings are crucial for Malaysian retirement adequacy. EPF recommends a minimum threshold of RM240,000 basic savings by age 55. We trace this balance to model future projections.";
                    case 4:
                        return "Debt Service Ratio (DSR) matches your monthly loan payments against your gross income. Malaysian banking guidelines recommend a DSR limit under 60-70% to guarantee future loan approvals.";
                    case 5:
                        return "Medical card limits protect against rising medical inflation in Malaysia (averaging 10-15% annually). Life coverage targets 10x your annual earnings to support families in case of death.";
                    case 6:
                        return "Insurance premium underwriting in Malaysia is heavily weighted by tobacco usage and existing health conditions. Specifying this helps generate accurate cost quotes.";
                    case 7:
                        return "Specifying educational levels (Local vs Private vs Overseas) defines target savings targets. Local university semesters average RM15k-RM40k, while overseas requires RM300k+.";
                    case 8:
                        return "Wills (Wasiat for Muslims) prevent asset freeze. Over RM11B in assets are currently locked in Malaysia due to lack of Wills and probate delays. EPF nominee updates are equally urgent.";
                    default:
                        return "";
                }
            };

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <span className="text-xs font-semibold tracking-wider text-gold uppercase">Discovery Process</span>
                            <h1 className="text-3xl font-serif font-light text-white mt-1">Capture Your Financial Portrait</h1>
                            <p className="text-textDim text-sm mt-1">Please select the filling mode best suited for your context.</p>
                        </div>
                        
                        {/* Dual Form Mode Toggle */}
                        {!isCFP ? (
                            <div className="flex bg-surface border border-border p-1 rounded-lg">
                                <button 
                                    onClick={() => setFormMode('guided')}
                                    className={`px-4 py-2 rounded text-xs font-semibold flex items-center gap-2 transition-all ${formMode === 'guided' ? 'bg-gold text-bg shadow' : 'text-textDim hover:text-text'}`}
                                >
                                    <i className="fas fa-compass"></i> Self-Guided (Client)
                                </button>
                                <button 
                                    onClick={() => setFormMode('advisor')}
                                    className={`px-4 py-2 rounded text-xs font-semibold flex items-center gap-2 transition-all ${formMode === 'advisor' ? 'bg-gold text-bg shadow' : 'text-textDim hover:text-text'}`}
                                >
                                    <i className="fas fa-user-tie"></i> Advisor Direct Entry
                                </button>
                            </div>
                        ) : (
                            <span className="text-[10px] font-bold text-gold uppercase tracking-wider bg-goldDim/30 border border-gold/20 px-3 py-2 rounded flex items-center gap-1.5 font-sans">
                                <i className="fas fa-user-tie text-[9px]"></i> Professional CFP Advisor Direct Entry Mode
                            </span>
                        )}
                    </div>

                    {/* =========================================================================
                       SELF-GUIDED MODE (STEP-BY-STEP)
                       ========================================================================= */}
                    {activeFormMode === 'guided' && (
                        <div className="grid grid-cols-1 lg:grid-cols-4 gap-6 items-start">
                            {/* Steps Side Tracker */}
                            <div className="lg:col-span-1 bg-surface border border-border rounded-lg p-4 space-y-1">
                                <p className="text-[10px] text-textDim uppercase font-bold tracking-wider px-3 mb-2">Step Progress</p>
                                {steps.map((s, idx) => (
                                    <button
                                        key={s.id}
                                        onClick={() => setStep(idx)}
                                        className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left transition-all ${step === idx ? 'bg-goldDim text-gold border border-gold/20' : (idx < step ? 'text-textMid hover:bg-surface2/50' : 'text-textDim hover:bg-surface2/30')}`}
                                    >
                                        <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold ${idx < step ? 'bg-gold text-bg' : step === idx ? 'bg-gold text-bg' : 'bg-border text-textDim'}`}>
                                            {idx < step ? '✓' : idx + 1}
                                        </span>
                                        <div className="min-w-0">
                                            <p className="text-xs font-semibold truncate">{s.label}</p>
                                        </div>
                                    </button>
                                ))}
                            </div>

                            {/* Center Panel */}
                            <div className="lg:col-span-3 space-y-6">
                                {/* Context Prompt (Why Ask Alert) */}
                                {step < 9 && (
                                    <div className="bg-goldDim border border-gold/30 rounded-lg p-4 text-xs text-textMid leading-relaxed relative group">
                                        <div className="flex justify-between items-start gap-4">
                                            <div className="flex gap-3 flex-1">
                                                <span className="text-gold text-base select-none mt-0.5">💡</span>
                                                <div className="flex-1">
                                                    <strong className="text-white font-medium">Why we ask this:</strong>{' '}
                                                    {editingComment ? (
                                                        <div className="mt-2 space-y-2">
                                                            <textarea
                                                                value={commentDraft}
                                                                onChange={(e) => setCommentDraft(e.target.value)}
                                                                className="w-full bg-surface border border-border rounded p-2 text-white outline-none focus:border-gold h-20 resize-none font-sans"
                                                            />
                                                            <div className="flex gap-2">
                                                                <button onClick={handleSaveEdit} className="bg-gold text-bg px-2.5 py-1 rounded font-semibold text-[10px] hover:bg-yellow-600 transition-colors">Save</button>
                                                                <button onClick={() => setEditingComment(false)} className="border border-border px-2.5 py-1 rounded text-[10px] text-textDim hover:text-white transition-colors">Cancel</button>
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <span>{getExplanatoryAlert(step)}</span>
                                                    )}
                                                </div>
                                            </div>
                                            {!editingComment && (
                                                <button 
                                                    onClick={handleStartEdit} 
                                                    className="opacity-0 group-hover:opacity-100 transition-opacity text-gold hover:text-white text-[10px] font-semibold flex items-center gap-1 bg-surface2 px-2 py-1 border border-border rounded whitespace-nowrap"
                                                    title="Edit Explanatory Comment"
                                                >
                                                    <i className="fas fa-edit"></i> Edit Guide
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                )}

                                <Card>
                                    <div className="border-b border-border pb-4 mb-6">
                                        <span className="text-[10px] uppercase font-bold tracking-widest text-gold">{steps[step].desc}</span>
                                        <h2 className="text-2xl font-serif text-white mt-1">{steps[step].label} Details</h2>
                                    </div>

                                    {/* Render dynamic sub forms */}
                                    <DiscoverySubForm step={step} clientData={clientData} setClientData={setClientData} updateField={updateField} calculated={calculated} />

                                    {/* Navigation Buttons */}
                                    <div className="flex justify-between items-center border-t border-border mt-8 pt-6">
                                        <button
                                            onClick={() => setStep(prev => Math.max(0, prev - 1))}
                                            disabled={step === 0}
                                            className={`px-5 py-2.5 border border-border rounded-lg text-xs font-semibold transition-all ${step === 0 ? 'text-textDim opacity-40 cursor-not-allowed' : 'text-text hover:bg-surface2 hover:border-textDim'}`}
                                        >
                                            <i className="fas fa-arrow-left mr-2"></i> Previous
                                        </button>

                                        {step < 9 ? (
                                            <button
                                                onClick={() => setStep(prev => Math.min(9, prev + 1))}
                                                className="bg-gold hover:bg-yellow-600 text-bg px-6 py-2.5 rounded-lg text-xs font-semibold transition-all"
                                            >
                                                Next Step <i className="fas fa-arrow-right ml-2"></i>
                                            </button>
                                        ) : (
                                            <button
                                                onClick={() => window.print()}
                                                className="bg-green hover:bg-emerald-600 text-white px-6 py-2.5 rounded-lg text-xs font-semibold transition-all"
                                            >
                                                📄 Print Full Summary
                                            </button>
                                        )}
                                    </div>
                                </Card>
                            </div>
                        </div>
                    )}

                    {/* =========================================================================
                       ADVISOR DIRECT ENTRY MODE (ACCORDION / CONTINUOUS FORM)
                       ========================================================================= */}
                    {activeFormMode === 'advisor' && (
                        <div className="grid grid-cols-1 xl:grid-cols-4 gap-6 items-start">
                            {/* Large Compact Form */}
                            <div className="xl:col-span-3 space-y-6">
                                <div className="bg-surface2/50 border border-border p-4 rounded-lg flex items-center justify-between text-xs text-textMid">
                                    <span>
                                        <i className="fas fa-info-circle text-gold mr-1.5"></i>
                                        <strong>Advisor Entry Mode active:</strong> Fields are compact for rapid typing. Data is dynamically shared.
                                    </span>
                                    <button 
                                        onClick={saveDraft}
                                        className="bg-gold text-bg px-3 py-1.5 rounded font-semibold text-[10px] hover:bg-yellow-600 uppercase tracking-wider transition-all"
                                    >
                                        Save Client Profile
                                    </button>
                                </div>

                                <Card>
                                    <div className="space-y-10">
                                        {/* Identity Section */}
                                        <div>
                                            <h3 className="font-serif text-lg text-gold border-b border-border pb-2 mb-4">1. Personal & Identity</h3>
                                            <DiscoverySubForm step={0} clientData={clientData} setClientData={setClientData} updateField={updateField} isAdvisorMode={true} />
                                        </div>

                                        {/* Family Section */}
                                        <div>
                                            <h3 className="font-serif text-lg text-gold border-b border-border pb-2 mb-4">2. Family & Dependents</h3>
                                            <DiscoverySubForm step={1} clientData={clientData} setClientData={setClientData} updateField={updateField} isAdvisorMode={true} />
                                        </div>

                                        {/* Income Section */}
                                        <div>
                                            <h3 className="font-serif text-lg text-gold border-b border-border pb-2 mb-4">3. Income & Business</h3>
                                            <DiscoverySubForm step={2} clientData={clientData} setClientData={setClientData} updateField={updateField} isAdvisorMode={true} />
                                        </div>

                                        {/* Assets Section */}
                                        <div>
                                            <h3 className="font-serif text-lg text-gold border-b border-border pb-2 mb-4">4. Assets & Properties</h3>
                                            <DiscoverySubForm step={3} clientData={clientData} setClientData={setClientData} updateField={updateField} isAdvisorMode={true} />
                                        </div>

                                        {/* Liabilities Section */}
                                        <div>
                                            <h3 className="font-serif text-lg text-gold border-b border-border pb-2 mb-4">5. Liabilities & Obligations</h3>
                                            <DiscoverySubForm step={4} clientData={clientData} setClientData={setClientData} updateField={updateField} isAdvisorMode={true} />
                                        </div>

                                        {/* Insurance Section */}

        /* =========================================================================

                    ...prev,

                                    </button>

                    currentWealth = currentWealth * (1 + roi / 100) + (monthlySave * 12);

                else {
                    const yearsInRetirement = age - retAge;
                    const adjustedAnnualBudget = (retBudget * 12) * Math.pow(1 + inflation / 100, yearsInRetirement);
                    currentWealth = currentWealth * (1 + roi / 100) - adjustedAnnualBudget;

        const RetirementView = ({ clientData, setClientData, calculated }) => {

            const retirementAge = parseInt(clientData.retireAge) || 60;
            const lifespan = 85;
            
            // Expected EPF interest rate (typically 5-6% in Malaysia)
            const epfRate = 0.055; 
            const investRate = 0.06;

            // Simple Projection logic
            const projectionPoints = [];
            let accumulatedCorpus = parseFloat(clientData.epf) + parseFloat(clientData.savings) + parseFloat(clientData.unitTrusts);
            const yearsToRetire = Math.max(1, retirementAge - currentAge);
            const monthlySavingsInvest = (calculated.totalMonthlyIncome * (parseInt(clientData.investPct) / 100));

            for (let yr = 0; yr <= yearsToRetire; yr++) {
                const age = currentAge + yr;

                                            </thead>
                                            <tbody className="divide-y divide-border/40 text-textMid">
                                                {(reviewRequests ? reviewRequests.filter(r => r.clientId === session.id) : []).map((req) => {
                                                    const hasUpdate = req.isNewForClient;
                                                    
                                                    return (
                                                        <React.Fragment key={req.id}>
                                                            <tr className={`hover:bg-surface2/20 transition-colors ${hasUpdate ? 'bg-goldDim/5 font-medium' : ''}`}>
                                                                <td className="py-3.5 px-4 text-textDim">
                                                                    <div className="flex items-center gap-1.5">
                                                                        {hasUpdate && <span className="w-2 h-2 rounded-full bg-gold animate-pulse flex-shrink-0"></span>}
                                                                        {req.requestDate}
                                                                    </div>
                                                                </td>
                                                                <td className="py-3.5 px-4 text-white font-medium">{req.appointmentDate} @ {req.appointmentTime}</td>
                                                                <td className="py-3.5 px-4 text-textMid">{req.meetingType}</td>
                                                                <td className="py-3.5 px-4">
                                                                    <div className="flex flex-wrap gap-1">
                                                                        {req.categories.map((c, i) => (
                                                                            <span key={i} className="text-[9px] bg-surface2 border border-border text-white px-1.5 py-0.5 rounded">
                                                                                {c}
                                                                            </span>
                                                                        ))}
                                                                    </div>
                                                                </td>
                                                                <td className="py-3.5 px-4">
                                                                    <span className={`text-[10px] px-2 py-0.5 rounded font-sans uppercase font-bold tracking-wider ${
                                                                        req.status === 'Accepted' ? 'bg-green/15 text-green border border-green/30' :
                                                                        req.status === 'Alternative Date Proposed' ? 'bg-amber/15 text-amber border border-amber/30 animate-pulse' :
                                                                        req.status === 'Rejected' ? 'bg-red/15 text-red border border-red/30' :
                                                                        req.status === 'Completed' ? 'bg-surface2 border border-border text-textDim' :
                                                                        'bg-goldDim text-gold border border-gold/30'
                                                                    }`}>
                                                                        {req.status}
                                                                    </span>
                                                                </td>
                                                                <td className="py-3.5 px-4 text-right">
                                                                    {hasUpdate && (
                                                                        <button
                                                                            type="button"
                                                                            onClick={() => handleDismissClientNotification(req.id)}
                                                                            className="text-[10px] bg-surface2 text-textDim hover:text-white px-2.5 py-1 rounded transition-colors mr-2 border border-border/80"
                                                                        >
                                                                            Mark Read
                                                                        </button>
                                                                    )}
                                                                    
                                                                    {(req.status === 'Alternative Date Proposed' || req.status === 'Rejected') && (
                                                                        <span className="text-[10px] text-textDim italic">Action available below</span>
                                                                    )}
                                                                    
                                                                    {req.status === 'Accepted' && (
                                                                        <span className="text-[10px] text-green font-semibold"><i className="fas fa-check-circle"></i> Confirmed</span>
                                                                    )}
                                                                </td>
                                                            </tr>
                                                            
                                                            {/* Nested Proposal details for client response */}
                                                            {(req.status === 'Alternative Date Proposed' || req.status === 'Rejected') && (
                                                                <tr>
                                                                    <td colSpan="6" className="bg-surface2/10 px-4 py-3 border-t-0">
                                                                        <div className="p-3 bg-surface2/55 border border-border rounded-lg text-xs space-y-3">
                                                                            {req.status === 'Alternative Date Proposed' ? (
                                                                                <>
                                                                                    <div className="flex items-center gap-1.5">
                                                                                        <i className="fas fa-clock text-amber"></i>
                                                                                        <span className="font-bold text-amber">Advisor Proposed Alternative Slot:</span>
                                                                                    </div>
                                                                                    <div>Suggested Date & Time: <strong className="text-white">{req.advisorSuggestedDate} @ {req.advisorSuggestedTime}</strong></div>
                                                                                    {req.advisorRemarks && <div>Advisor Message: <span className="italic text-text">"{req.advisorRemarks}"</span></div>}
                                                                                    
                                                                                    <div className="flex gap-2 pt-1.5">
                                                                                        <button
                                                                                            type="button"
                                                                                            onClick={() => handleAcceptAlternativeSlot(req.id, req.advisorSuggestedDate, req.advisorSuggestedTime)}
                                                                                            className="bg-green/20 hover:bg-green-600 text-green hover:text-white border border-green/30 px-3 py-1.5 rounded text-[10px] font-bold transition-colors"
                                                                                        >
                                                                                            Accept Proposal
                                                                                        </button>
                                                                                        <button
                                                                                            type="button"
                                                                                            onClick={() => handleResubmitRevisedRequest(req)}
                                                                                            className="bg-gold hover:bg-yellow-600 text-bg px-3 py-1.5 rounded text-[10px] font-bold transition-colors"
                                                                                        >
                                                                                            Modify & Resubmit
                                                                                        </button>
                                                                                    </div>
                                                                                </>
                                                                            ) : (
                                                                                <>
                                                                                    <div className="flex items-center gap-1.5">
                                                                                        <i className="fas fa-ban text-red"></i>
                                                                                        <span className="font-bold text-red">Advisor Rejection Notes:</span>
                                                                                    </div>
                                                                                    <div>Reason: <span className="italic text-text">"{req.rejectionReason}"</span></div>
                                                                                    {req.advisorRemarks && <div>Advisor Suggestion: <strong className="text-white">{req.advisorRemarks}</strong></div>}
                                                                                    
                                                                                    <div className="pt-1.5">
                                                                                        <button
                                                                                            type="button"
                                                                                            onClick={() => handleResubmitRevisedRequest(req)}
                                                                                            className="bg-gold hover:bg-yellow-600 text-bg px-3 py-1.5 rounded text-[10px] font-bold transition-colors"
                                                                                        >
                                                                                            Create New Request Form
                                                                                        </button>
                                                                                    </div>
                                                                                </>
                                                                            )}
                                                                        </div>
                                                                    </td>
                                                                </tr>
                                                            )}
                                                        </React.Fragment>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        </Card>
                    )}

                    {/* Custom Notification Modal */}
                    {notificationModal.isOpen && (
                        <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center backdrop-blur-sm animate-fade-in p-4">
                            <Card className="max-w-md w-full border border-gold/30 shadow-2xl relative p-6 bg-surface">
                                <button 
                                    onClick={() => setNotificationModal(prev => ({ ...prev, isOpen: false }))} 
                                    className="absolute top-4 right-4 text-textDim hover:text-white transition-colors"
                                >
                                    <i className="fas fa-times text-lg"></i>
                                </button>
                                <div className="text-center py-4 space-y-4 font-sans">
                                    <div className={`w-16 h-16 border rounded-full flex items-center justify-center text-3xl mx-auto ${
                                        notificationModal.type === 'success' 
                                            ? 'bg-green/10 border-green/30 text-green animate-bounce' 
                                            : 'bg-goldDim/10 border-gold/30 text-gold'
                                    }`}>
                                        <i className={notificationModal.type === 'success' ? 'fas fa-check-circle' : 'fas fa-info-circle'}></i>
                                    </div>
                                    <h3 className="font-serif text-lg text-white">{notificationModal.title}</h3>
                                    <p className="text-xs text-textMid leading-relaxed max-w-xs mx-auto">
                                        {notificationModal.message}
                                    </p>
                                    <div className="pt-2">
                                        <button 
                                            onClick={() => setNotificationModal(prev => ({ ...prev, isOpen: false }))} 
                                            className="bg-gold hover:bg-yellow-600 text-bg font-bold px-6 py-2 rounded-lg text-xs transition-colors uppercase tracking-wider"
                                        >
                                            Dismiss
                                        </button>
                                    </div>
                                </div>
                            </Card>
                        </div>
                    )}
                </div>
            );
        };

        /* =========================================================================
           CRM BOOKING MODAL
           ========================================================================= */
        const CrmBookingModal = ({ clientData, calculated, onClose }) => {
            const [step, setStep] = useState(1); // 1: Form, 2: Success
            const [selectedDate, setSelectedDate] = useState('2026-06-15');
            const [selectedTime, setSelectedTime] = useState('14:00');
            
            // Auto-select mapped advisor
            const clientRecord = CLIENT_DB.find(c => c.name === clientData.fullName);
            const mappedAdvisor = clientRecord ? ADVISORS_DB.find(a => a.id === clientRecord.advisorId) : null;
            const [selectedAdvisor, setSelectedAdvisor] = useState(
                mappedAdvisor ? `${mappedAdvisor.name} (${mappedAdvisor.role === 'CFP' ? 'CFP' : 'IFP'})` : 'Farah Hashim (CFP)'
            );

            const handleConfirm = () => {
                setStep(2);
                setTimeout(() => {
                    onClose();
                }, 2200);
            };

            return (
                <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center backdrop-blur-sm animate-fade-in p-4">
                    <Card className="max-w-md w-full border border-gold/30 shadow-2xl relative p-6 bg-surface">
                        <button onClick={onClose} className="absolute top-4 right-4 text-textDim hover:text-white transition-colors">
                            <i className="fas fa-times text-lg"></i>
                        </button>
                        {step === 1 ? (
                            <div className="space-y-5">
                                <h3 className="font-serif text-xl text-gold border-b border-border pb-2">Schedule CFP Review</h3>
                                <p className="text-xs text-textMid leading-relaxed">
                                    Book a direct review with a licensed financial planner. Your dynamic financial profile statistics will sync automatically to the CRM portal.
                                </p>
                                <div className="p-3 bg-surface2/50 border border-border rounded text-[11px] text-textDim space-y-1">
                                    <div>Client profile: <strong className="text-white">{clientData.fullName}</strong></div>
                                    <div>Calculated Net Worth: <strong className="text-gold">{fmt(calculated.netWorth)}</strong></div>
                                    <div>Debt Service Ratio: <strong className="text-white">{calculated.dsr.toFixed(1)}%</strong></div>
                                </div>
                                <div className="space-y-3 text-xs">
                                    <div className="flex flex-col gap-1">
                                        <label className="text-textDim uppercase font-medium">Select Advisor</label>
                                        <select 
                                            value={selectedAdvisor} 
                                            onChange={(e) => setSelectedAdvisor(e.target.value)}
                                            className="bg-surface2 border border-border rounded p-2 text-white outline-none w-full"
                                        >
                                            <option value="Farah Hashim (CFP)">Farah Hashim — Certified CFP (Specialist: Tax & Investments)</option>
                                            <option value="Aiman Syazwan (IFP)">Aiman Syazwan — Islamic Estate Planner (Specialist: Hibah & Wasiat)</option>
                                            <option value="Devi Letchumi (CFP)">Devi Letchumi — Certified CFP (Specialist: Debt Restructuring)</option>
                                        </select>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="flex flex-col gap-1">
                                            <label className="text-textDim uppercase font-medium">Select Date</label>
                                            <input 
                                                type="date" 
                                                value={selectedDate} 
                                                onChange={(e) => setSelectedDate(e.target.value)}
                                                className="bg-surface2 border border-border rounded p-2 text-white outline-none w-full"
                                            />
                                        </div>
                                        <div className="flex flex-col gap-1">
                                            <label className="text-textDim uppercase font-medium">Select Time</label>
                                            <select 
                                                value={selectedTime} 
                                                onChange={(e) => setSelectedTime(e.target.value)}
                                                className="bg-surface2 border border-border rounded p-2 text-white outline-none w-full"
                                            >
                                                <option value="10:00">10:00 AM</option>
                                                <option value="11:30">11:30 AM</option>
                                                <option value="14:00">02:00 PM</option>
                                                <option value="15:30">03:30 PM</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div className="flex gap-2 pt-2 text-xs">
                                    <button onClick={onClose} className="flex-1 py-2.5 border border-border rounded-lg text-textDim hover:text-white transition-colors">Cancel</button>
                                    <button onClick={handleConfirm} className="flex-1 py-2.5 bg-gold hover:bg-yellow-600 text-bg font-bold rounded-lg transition-colors">Confirm & Sync CRM</button>
                                </div>
                            </div>
                        ) : (
                            <div className="text-center py-6 space-y-4">
                                <div className="w-16 h-16 bg-green/10 border border-green/30 text-green rounded-full flex items-center justify-center text-3xl mx-auto animate-bounce">
                                    <i className="fas fa-check-circle"></i>
                                </div>
                                <h3 className="font-serif text-xl text-white">Consultation Booked!</h3>
                                <p className="text-xs text-textMid leading-relaxed max-w-xs mx-auto">
                                    Your review session with <strong>{selectedAdvisor}</strong> on <strong>{selectedDate} ({selectedTime})</strong> has been scheduled.
                                </p>
                                <p className="text-[10px] text-textDim">
                                    Your client profile file has been synchronized with the CRM database. Closing...
                                </p>
                            </div>
                        )}
                    </Card>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
