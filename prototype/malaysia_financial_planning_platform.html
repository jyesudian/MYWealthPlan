<!DOCTYPE html>
<html lang="en">
<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#0ea5e9', // Sky Blue
                        secondary: '#34d399', // Light Green
                        accent: '#6366f1', // Deep Blue/Purple
                        background: '#f8fafc',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>

        const Dashboard = ({ setActiveTab }) => {

                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">

                            </div>
                            <div className="mt-4 flex items-center gap-2">
                                <span className="bg-green-100 text-green-700 text-xs px-2 py-1 rounded font-bold">Good</span>
                                <span className="text-xs text-slate-400">Top 20% of peers</span>
                            </div>
                        </Card>

                        <Card className="flex flex-col justify-center border-t-4 border-t-primary">
                            <div className="flex justify-between items-start">
                                <div>
                                    <p className="text-sm text-slate-500 mb-1">Net Worth</p>
                                    <h2 className="text-2xl font-bold text-slate-800">RM 450,000</h2>

                                <div>Liab: <span className="text-rose-500 font-bold">RM 300k</span></div>
                            </div>
                        </Card>

                        <Card className="flex flex-col justify-center border-t-4 border-t-secondary">
                            <div className="flex justify-between items-start">
                                <div>
                                    <p className="text-sm text-slate-500 mb-1">Monthly Savings Rate</p>
                                    <h2 className="text-2xl font-bold text-slate-800">29%</h2>
                                </div>
                                <div className="w-10 h-10 rounded-full bg-emerald-50 flex items-center justify-center text-secondary">
                                    <i className="fas fa-piggy-bank"></i>
                                </div>
                            </div>
                            <div className="mt-4">
                                <ProgressBar progress={29} color="bg-secondary" />
                                <p className="text-xs text-slate-400 mt-2">Target: 30%</p>
                            </div>
                        </Card>

                        <Card className="flex flex-col justify-center border-t-4 border-t-accent">
                            <div className="flex justify-between items-start">
                                <div>
                                    <p className="text-sm text-slate-500 mb-1">Retirement Readiness</p>
                                    <h2 className="text-2xl font-bold text-slate-800">84%</h2>
                                </div>
                                <div className="w-10 h-10 rounded-full bg-indigo-50 flex items-center justify-center text-accent">
                                    <i className="fas fa-umbrella-beach"></i>
                                </div>
                            </div>
                            <div className="mt-4">
                                <ProgressBar progress={84} color="bg-accent" />
                                <p className="text-xs text-slate-400 mt-2">On track for Age 60</p>
                            </div>
                        </Card>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2 space-y-6">
                            <Card>
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="font-bold text-slate-800">Net Worth Breakdown</h3>
                                    <button 
                                        onClick={() => setActiveTab('discovery')}

                                    >
                                        Update Assets <i className="fas fa-chevron-right text-xs ml-1"></i>
                                    </button>
                                </div>
                                <div className="space-y-4">
                                    <div>
                                        <div className="flex justify-between text-sm mb-1">
                                            <span className="text-slate-600 font-medium">EPF & Retirement</span>
                                            <span className="font-bold text-slate-800">RM 337,500</span>
                                        </div>
                                        <ProgressBar progress={45} color="bg-primary" />
                                    </div>
                                    <div>
                                        <div className="flex justify-between text-sm mb-1">
                                            <span className="text-slate-600 font-medium">Real Estate (Property)</span>
                                            <span className="font-bold text-slate-800">RM 225,000</span>
                                        </div>
                                        <ProgressBar progress={30} color="bg-secondary" />

                                            <span className="font-bold text-slate-800">RM 75,000</span>
                                        </div>
                                        <ProgressBar progress={10} color="bg-amber-400" />
                                    </div>
                                    <div>
                                        <div className="flex justify-between text-sm mb-1">
                                            <span className="text-slate-600 font-medium">Equities & Investments</span>

                                        </div>
                                        <ProgressBar progress={15} color="bg-accent" />
                                    </div>
                                </div>
                            </Card>
                        </div>
                        
                        <div className="space-y-6">
                            <Card className="bg-slate-800 text-white border-none relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-32 h-32 bg-white opacity-5 rounded-full transform translate-x-1/2 -translate-y-1/2"></div>
                                <h3 className="font-bold mb-2">Need Expert Advice?</h3>
                                <p className="text-sm text-slate-300 mb-4">Connect with a certified financial planner to optimize your portfolio.</p>
                                <button className="w-full bg-primary hover:bg-sky-600 text-white py-2 rounded-xl text-sm font-medium transition-colors">Book Consultation</button>
                            </Card>

                                <div className="p-4 bg-rose-50 border-b border-rose-100 flex justify-between items-center">
                                    <h3 className="font-bold text-rose-800">Credit Cards & Personal</h3>
                                    <span className="font-bold text-rose-600">RM 15,000</span>
                                </div>
                                <div className="p-4 space-y-4">

            const prevStep = () => setStep(s => Math.max(1, s - 1));

            return (
                <div className="space-y-6 animate-fade-in">
                    <div>
                        <h1 className="text-2xl font-bold text-slate-800">Financial Discovery Journey</h1>
                        <p className="text-slate-500 text-sm mt-1">Let's build your financial profile step-by-step.</p>
                    </div>
                    <Card>
                        <div className="flex justify-between items-center border-b border-slate-100 pb-4 mb-4">
                            <div className="flex gap-2">
                                {[1, 2, 3, 4, 5, 6].map(s => (
                                    <div key={s} className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm transition-colors ${s === step ? 'bg-primary text-white shadow-md' : (s < step ? 'bg-sky-100 text-primary' : 'bg-slate-100 text-slate-400')}`}>
                                        {s < step ? <i className="fas fa-check"></i> : s}
                                    </div>
                                ))}
                            </div>
                            <span className="text-sm font-medium text-slate-500">Step {step} of 6</span>
                        </div>
                        
                        <div className="space-y-4 min-h-[250px]">
                            {step === 1 && (
                                <div className="animate-fade-in">
                                    <h2 className="text-lg font-bold text-slate-800 mb-4">Personal Information</h2>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
                                            <input type="text" className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-primary outline-none" defaultValue="Ahmad Razali" />
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Age</label>
                                                <input type="number" className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-primary outline-none" defaultValue="38" />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Marital Status</label>
                                                <select className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-primary outline-none">
                                                    <option>Married</option>
                                                    <option>Single</option>
                                                    <option>Divorced</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {step === 2 && (
                                <div className="animate-fade-in">
                                    <h2 className="text-lg font-bold text-slate-800 mb-4">Income Sources (Monthly)</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Salary</label>
                                            <input type="text" className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-primary outline-none" placeholder="RM 0" defaultValue="RM 10,000" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Business Income</label>
                                            <input type="text" className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-primary outline-none" placeholder="RM 0" defaultValue="RM 1,500" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Rental Income</label>
                                            <input type="text" className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-primary outline-none" placeholder="RM 0" defaultValue="RM 500" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Other Income</label>
                                            <input type="text" className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-primary outline-none" placeholder="RM 0" />
                                        </div>
                                    </div>
                                </div>
                            )}

                            {}
                            {step === 3 && (
                                <div className="animate-fade-in">
                                    <h2 className="text-lg font-bold text-slate-800 mb-4">Expenses (Monthly)</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Housing</label>
                                            <input type="text" className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-primary outline-none" placeholder="RM 0" defaultValue="RM 2,500" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Utilities</label>
                                            <input type="text" className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-primary outline-none" placeholder="RM 0" defaultValue="RM 600" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Transportation</label>
                                            <input type="text" className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-primary outline-none" placeholder="RM 0" defaultValue="RM 1,200" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Education</label>
                                            <input type="text" className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-primary outline-none" placeholder="RM 0" defaultValue="RM 1,000" />
                                        </div>
                                    </div>
                                </div>
                            )}

                            {step === 4 && (
                                <div className="animate-fade-in">
                                    <h2 className="text-lg font-bold text-slate-800 mb-4">Assets Overview</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Cash & Savings</label>
                                            <input type="text" className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-primary outline-none" placeholder="RM 0" defaultValue="RM 75,000" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">EPF (Retirement)</label>
                                            <input type="text" className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-primary outline-none" placeholder="RM 0" defaultValue="RM 337,500" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Investments</label>
                                            <input type="text" className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-primary outline-none" placeholder="RM 0" defaultValue="RM 112,500" />
                                        </div>
                                        <div>

                                            <input type="text" className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-primary outline-none" placeholder="RM 0" defaultValue="RM 225,000" />
                                        </div>
                                    </div>
                                </div>
                            )}

                            {step === 5 && (
                                <div className="animate-fade-in">
                                    <h2 className="text-lg font-bold text-slate-800 mb-4">Liabilities Overview</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Mortgage(s)</label>
                                            <input type="text" className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-primary outline-none" placeholder="RM 0" defaultValue="RM 200,000" />

                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Vehicle Loans</label>

                                    <div className="space-y-3">
                                        {['Retirement Readiness', 'Child Education', 'House Purchase', 'Wealth Growth', 'Estate / Legacy'].map((goal, idx) => (
                                            <label key={idx} className="flex items-center gap-3 p-3 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50 transition-colors">
                                                <input type="checkbox" className="w-5 h-5 accent-primary" defaultChecked={idx < 3} />
                                                <span className="font-medium text-slate-700">{goal}</span>
                                            </label>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="mt-6 flex justify-between pt-4 border-t border-slate-100">
                            <button onClick={prevStep} disabled={step === 1} className={`px-6 py-2 rounded-xl font-medium transition-colors ${step === 1 ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}>
                                <i className="fas fa-arrow-left mr-2"></i> Previous
                            </button>
                            <button onClick={nextStep} className="bg-primary hover:bg-sky-600 text-white px-6 py-2 rounded-xl font-medium transition-colors">
                                {step === 6 ? 'Complete Profile' : 'Next Step'} {step !== 6 && <i className="fas fa-arrow-right ml-2"></i>}
                            </button>
                        </div>
                    </Card>

            );

        const GoalPlanner = () => {
            const [showNewGoal, setShowNewGoal] = useState(false);

            if (showNewGoal) {
                return (
                    <div className="space-y-6 animate-fade-in">
                        <div className="flex items-center gap-4">
                            <button onClick={() => setShowNewGoal(false)} className="w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 transition-colors">
                                <i className="fas fa-arrow-left"></i>
                            </button>
                            <div>
                                <h1 className="text-2xl font-bold text-slate-800">Create New Goal</h1>
                                <p className="text-slate-500 text-sm mt-1">Set a new financial milestone to track.</p>
                            </div>
                        </div>
                        <Card className="max-w-2xl">
                            <div className="space-y-5">
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">Goal Name</label>
                                    <input type="text" className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-primary outline-none" placeholder="e.g., Vacation to Japan, Emergency Fund" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">Goal Category</label>
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                        {['Education', 'Property', 'Travel', 'Wealth'].map(cat => (
                                            <div key={cat} className="border border-slate-200 rounded-lg p-3 text-center cursor-pointer hover:border-primary hover:bg-sky-50 transition-colors">
                                                <span className="text-sm font-medium text-slate-700">{cat}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">Target Amount (RM)</label>
                                        <input type="number" className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-primary outline-none" placeholder="50000" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">Target Year</label>
                                        <input type="number" className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-primary outline-none" placeholder="2030" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">Current Savings (RM)</label>
                                        <input type="number" className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-primary outline-none" placeholder="0" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">Monthly Contribution (RM)</label>
                                        <input type="number" className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-primary outline-none" placeholder="500" />
                                    </div>
                                </div>
                                <div className="pt-4 flex justify-end gap-3 border-t border-slate-100">
                                    <button onClick={() => setShowNewGoal(false)} className="px-6 py-2 rounded-xl text-slate-600 font-medium hover:bg-slate-100 transition-colors">Cancel</button>
                                    <button onClick={() => setShowNewGoal(false)} className="bg-primary hover:bg-sky-600 text-white px-6 py-2 rounded-xl font-medium transition-colors">Save Goal</button>
                                </div>
                            </div>
                        </Card>
                    </div>
                );
            }

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="flex justify-between items-center">
                        <div>
                            <h1 className="text-2xl font-bold text-slate-800">Goal Planning</h1>
                            <p className="text-slate-500 text-sm mt-1">Track and manage your life milestones.</p>
                        </div>
                        <button onClick={() => setShowNewGoal(true)} className="bg-primary hover:bg-sky-600 text-white px-4 py-2 rounded-xl text-sm font-medium"><i className="fas fa-plus mr-2"></i> New Goal</button>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <Card>
